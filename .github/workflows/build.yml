name: Build isolated ClearKey prototype
on:
  workflow_dispatch:
    inputs:
      prior_evidence_run:
        description: 'Optional owned CI result to inspect;no private sources'
        required: false
        default: ''
      asan:
        description: 'Enable native Address Sanitizer for owned tests'
        type: boolean
        required: false
        default: false
      original_player_focus:
        description: 'Diagnostic only:run original AVPlayer owned media cases;not a release gate'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: clearkey-prototype
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          for app in $(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -r); do
            export DEVELOPER_DIR="$app/Contents/Developer"
            if [[ $(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1) -ge 26 ]]; then
              echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
              xcodebuild -version
              exit 0
            fi
          done
          exit 1
      - name: Generate synthetic encrypted media only
        run: |
          if ! command -v ffmpeg >/dev/null; then brew install ffmpeg; fi
          python3 tools/generate_fixtures.py Tests/Fixtures
          mkdir -p Sources/Assets
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=black:size=32x32:rate=1/30 \
            -t 28800 -c:v libx264 -pix_fmt yuv420p -an -movflags +faststart Sources/Assets/CKPlaceholder.mp4
      - name: Inspect previous owned CI crash if requested
        if: inputs.prior_evidence_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_RUN: ${{ inputs.prior_evidence_run }}
        run: |
          [[ "$PRIOR_RUN" =~ ^[0-9]+$ ]] || exit 1
          mkdir -p build/prior-evidence
          gh run download "$PRIOR_RUN" -R "$GITHUB_REPOSITORY" -n ClearKey-build-evidence -D build/prior-evidence
          python3 tools/owned_test_diagnostics.py build/prior-evidence/CKTests.xcresult build/previous-owned-diagnostics
      - name: Generate framework and test host
        run: |
          brew install xcodegen nasm
          xcodegen generate
      - uses: actions/cache/restore@v4
        id: packages-cache
        with:
          path: build/packages
          key: ks3558-ff61-macos15-packages-v1
      - name: Resolve pinned packages once
        run: xcodebuild -resolvePackageDependencies -project CKBridge.xcodeproj -scheme CKBridge -clonedSourcePackagesDirPath build/packages
      - uses: actions/cache/save@v4
        if: steps.packages-cache.outputs.cache-hit != 'true'
        with:
          path: build/packages
          key: ks3558-ff61-macos15-packages-v1
      - uses: actions/cache/restore@v4
        id: core-cache
        with:
          path: build/ffmpeg-lgpl/output
          key: ffmpeg61-lgpl-ios155-xcode26-multikey-v4-${{ hashFiles('tools/build_lgpl_core.py', 'tools/ffmpeg_cenc_multikey.py') }}-${{ github.run_id }}
          restore-keys: ffmpeg61-lgpl-ios155-xcode26-multikey-v4-${{ hashFiles('tools/build_lgpl_core.py', 'tools/ffmpeg_cenc_multikey.py') }}-
      - name: Rebuild LGPL-only playback core
        run: |
          set -o pipefail
          python3 tools/build_lgpl_core.py 2>&1 | tee build/lgpl-core.log
          CK_FFMPEG_SOURCE_ARCHIVE=build/ffmpeg-lgpl/ffmpeg-6.1.tar.xz \
            python3 -m unittest discover -s tools -p test_ffmpeg_backport.py -v
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: build/ffmpeg-lgpl/output
          key: ffmpeg61-lgpl-ios155-xcode26-multikey-v4-${{ hashFiles('tools/build_lgpl_core.py', 'tools/ffmpeg_cenc_multikey.py') }}-${{ github.run_id }}
      - name: Compile device module
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project CKBridge.xcodeproj -scheme CKBridge -configuration Release -sdk iphoneos \
            -clonedSourcePackagesDirPath build/packages -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/device-build.log
      - name: Run native module tests
        env:
          OWNED_ASAN: ${{ inputs.asan }}
          OWNED_ORIGINAL_FOCUS: ${{ inputs.original_player_focus }}
        run: |
          set -o pipefail
          python3 tools/fixture_http.py Tests/Fixtures > build/fixture-http.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -sf http://127.0.0.1:18761/health >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:18761/health >/dev/null
          sanitizer=NO
          sanitizer_flags=()
          focused_tests=()
          if [[ "$OWNED_ORIGINAL_FOCUS" == "true" ]]; then
            focused_tests=(
              -only-testing:CKTests/CKOriginalPlayerTests
              -only-testing:CKTests/CKLiveEngineTests/testNativeImportedPlaylistAndOriginalAVPlayerRouteStartMovingStereoEngine
              -only-testing:CKTests/CKLiveEngineTests/testOriginalAVPlayerPreloadedKeyChangeKeepsItemAndMovingFrames
              -only-testing:CKTests/CKLiveEngineTests/testOriginalAVPlayerLicensedKeyChangeKeepsItemAndMovingFrames
            )
          fi
          if [[ "$OWNED_ASAN" == "true" ]]; then
            sanitizer=YES
            # SPM's generated dynamic product also needs the sanitizer runtime.
            sanitizer_flags=('OTHER_LDFLAGS=$(inherited) -fsanitize=address')
          fi
          simulator=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if x.get("isAvailable") and "iPhone" in x["name"]))')
          xcodebuild -project CKBridge.xcodeproj -scheme CKHost -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator" -derivedDataPath build/simulator \
            -clonedSourcePackagesDirPath build/packages \
            -resultBundlePath build/CKTests.xcresult -enableAddressSanitizer "$sanitizer" CODE_SIGNING_ALLOWED=NO \
            "${sanitizer_flags[@]}" "${focused_tests[@]}" test 2>&1 | tee build/native-tests.log
      - name: Export owned test failures without private data
        if: always()
        run: python3 tools/owned_test_diagnostics.py build/CKTests.xcresult build/owned-test-diagnostics
      - name: Package framework only, never third-party IPA or private sources
        run: python3 tools/package_module.py build/device/Build/Products/Release-iphoneos build/module
      - uses: actions/upload-artifact@v4
        with:
          name: ClearKey-module
          path: build/module
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ClearKey-build-evidence
          path: |
            build/*.log
            build/CKTests.xcresult
          retention-days: 7
