name: Build isolated ClearKey prototype
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clearkey-prototype
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          for app in $(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -r); do
            export DEVELOPER_DIR="$app/Contents/Developer"
            if [[ $(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1) -ge 26 ]]; then
              echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
              xcodebuild -version
              exit 0
            fi
          done
          exit 1
      - name: Generate synthetic encrypted media only
        run: |
          if ! command -v ffmpeg >/dev/null; then brew install ffmpeg; fi
          mkdir -p Tests/Fixtures
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=red:size=128x72:rate=10 \
            -t 3 -c:v libx264 -pix_fmt yuv420p -g 10 -an -f dash -seg_duration 1 \
            -use_template 1 -use_timeline 1 \
            -format_options encryption_scheme=cenc-aes-ctr:encryption_key=101112131415161718191a1b1c1d1e1f:encryption_kid=000102030405060708090a0b0c0d0e0f \
            Tests/Fixtures/manifest.mpd
          python3 -c 'from pathlib import Path; p=Path("Tests/Fixtures"); assert any(b"senc" in x.read_bytes() or b"tenc" in x.read_bytes() for x in p.glob("*.m4s")), "fixture is not encrypted"'
      - name: Generate framework and test host
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Resolve pinned packages once
        run: xcodebuild -resolvePackageDependencies -project CKBridge.xcodeproj -scheme CKBridge -clonedSourcePackagesDirPath build/packages
      - uses: actions/cache@v4
        with:
          path: build/ffmpeg-lgpl/output
          key: ffmpeg61-lgpl-ios155-xcode26-v1
      - name: Rebuild LGPL-only playback core
        run: |
          set -o pipefail
          python3 tools/build_lgpl_core.py 2>&1 | tee build/lgpl-core.log
      - name: Compile device module
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project CKBridge.xcodeproj -scheme CKBridge -configuration Release -sdk iphoneos \
            -clonedSourcePackagesDirPath build/packages -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/device-build.log
      - name: Run native module tests
        run: |
          set -o pipefail
          simulator=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if x.get("isAvailable") and "iPhone" in x["name"]))')
          xcodebuild -project CKBridge.xcodeproj -scheme CKHost -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator" -derivedDataPath build/simulator \
            -clonedSourcePackagesDirPath build/packages \
            -resultBundlePath build/CKTests.xcresult CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee build/native-tests.log
      - name: Package framework only, never third-party IPA or private sources
        run: python3 tools/package_module.py build/device/Build/Products/Release-iphoneos build/module
      - uses: actions/upload-artifact@v4
        with:
          name: ClearKey-module
          path: build/module
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ClearKey-build-evidence
          path: |
            build/*.log
            build/CKTests.xcresult
          retention-days: 7
