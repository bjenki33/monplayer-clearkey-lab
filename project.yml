name: CKBridge
options:
  deploymentTarget:
    iOS: '15.5'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ''
packages:
  KSPlayer:
    url: https://github.com/kingslay/KSPlayer.git
    revision: 3558c7645240a191c3e4672eabe7b6ae1ee4f4ae
  FFmpegKit:
    url: https://github.com/kingslay/FFmpegKit.git
    exactVersion: 6.1.0
targets:
  CKBridge:
    type: framework
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.bocphot.CKBridge
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        MACH_O_TYPE: mh_dylib
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO
        LD_RUNPATH_SEARCH_PATHS: '$(inherited) @executable_path/Frameworks @loader_path/..'
    dependencies:
      - package: KSPlayer
      - package: FFmpegKit
  CKHost:
    type: application
    platform: iOS
    sources: [Host]
    info:
      path: build/CKHost-Info.plist
      properties:
        CKNativeLinkMode: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true # CI host only, for owned loopback HTTP fixtures.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.bocphot.CKHost
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - target: CKBridge
        embed: true
  CKTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: [Fixtures]
      - path: Tests/Fixtures
        buildPhase: resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.bocphot.CKTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: CKHost
      - target: CKBridge
      - package: FFmpegKit
schemes:
  CKBridge:
    build:
      targets:
        CKBridge: all
  CKHost:
    build:
      targets:
        CKHost: all
    test:
      targets: [CKTests]
